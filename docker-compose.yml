# Local dev database: `docker compose up -d db`.
# Port 5433 (not 5432) so it can run next to Scanvio's local database.
services:
  db:
    image: postgres:16-alpine
    container_name: ict-db
    environment:
      POSTGRES_USER: ict
      POSTGRES_PASSWORD: ict
      POSTGRES_DB: ict_dev
    ports:
      - "5433:5432"
    volumes:
      - ict_pgdata:/var/lib/postgresql/data

volumes:
  ict_pgdata:
